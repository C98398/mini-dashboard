 'use strict';
 const $=s=>document.querySelector(s),encoder=new TextEncoder(),aad=encoder.encode('mini-dashboard/v1');
 let payload=JSON.parse($('#mini-locked').textContent),activeKey=null,frame=null,expiry=null,busy=false,generation=0;
 const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 function validate(p){if(p.version!==1||p.iterations!==600000||bytes(p.salt).length!==32||bytes(p.iv).length!==12)throw new Error('Invalid encrypted page')}
 async function derive(username,password,p){
  validate(p);const material=await crypto.subtle.importKey('raw',encoder.encode(username+'\0'+password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(p.salt),iterations:p.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 }
 async function decrypt(p,key){
  validate(p);const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(p.iv),additionalData:aad,tagLength:128},key,bytes(p.data));
  return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 }
 function showDashboard(html){
  const next=document.createElement('iframe');next.id='dashboardFrame';next.title='mini看板内容';next.srcdoc=html;
  if(frame)frame.replaceWith(next);else document.body.append(next);frame=next;$('#loginView').hidden=true;
 }
 function logout(message='你已退出登录。'){
  generation++;activeKey=null;clearTimeout(expiry);if(frame)frame.remove();frame=null;busy=false;
  $('#loginView').hidden=false;$('#password').value='';$('#password').type='password';$('#reveal').textContent='显示';$('#reveal').setAttribute('aria-label','显示密码');$('#loginButton').disabled=false;$('#loginButton').textContent='登录看板 →';$('#loginStatus').textContent=message;$('#password').focus();
 }
 function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3500)}
 $('#reveal').onclick=()=>{const visible=$('#password').type==='password';$('#password').type=visible?'text':'password';$('#reveal').textContent=visible?'隐藏':'显示';$('#reveal').setAttribute('aria-label',visible?'隐藏密码':'显示密码')};
 $('#loginForm').onsubmit=async e=>{
  e.preventDefault();if(busy)return;busy=true;const token=++generation;$('#loginStatus').textContent='';$('#loginButton').disabled=true;$('#loginButton').textContent='正在验证…';
  try{
   if(!crypto.subtle||typeof DecompressionStream==='undefined')throw new Error('Unsupported browser');
   const key=await derive($('#username').value.trim(),$('#password').value,payload),html=await decrypt(payload,key);if(token!==generation)return;
   activeKey=key;$('#password').value='';showDashboard(html);expiry=setTimeout(()=>logout('登录已过期，请重新登录。'),2*60*60*1000);
  }catch(error){if(token===generation)$('#loginStatus').textContent=error.message==='Unsupported browser'?'请使用较新版本的浏览器，并通过 HTTPS 打开页面。':'账号或密码不正确，请重新输入。'}
  finally{if(token===generation){busy=false;$('#loginButton').disabled=false;$('#loginButton').textContent='登录看板 →'}}
 };
 window.addEventListener('message',async e=>{
  if(!frame||e.source!==frame.contentWindow||e.origin!==location.origin)return;
  if(e.data?.type==='mini-logout'){logout();return}
  if(e.data?.type!=='mini-refresh'||busy||!activeKey)return;
  busy=true;const token=generation;toast('正在刷新快照…');
  try{
   const response=await fetch(location.href,{cache:'no-store'});if(!response.ok)throw new Error('Fetch failed');
   const doc=new DOMParser().parseFromString(await response.text(),'text/html'),next=JSON.parse(doc.getElementById('mini-locked').textContent);validate(next);
   if(next.salt!==payload.salt){logout('登录信息已更新，请重新登录。');return}
   const html=await decrypt(next,activeKey);if(token!==generation)return;payload=next;showDashboard(html);toast('已加载最新快照');
  }catch{if(token===generation)toast('刷新失败，当前快照已保留，请稍后重试。')}
  finally{if(token===generation)busy=false}
 });
 window.addEventListener('pagehide',()=>{generation++;activeKey=null;clearTimeout(expiry);if(frame)frame.remove();frame=null});
 window.addEventListener('pageshow',e=>{if(e.persisted)logout('请重新登录。')});
})();
</script></body></html>
